<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4c5b0"/>
      <stop offset="100%" stop-color="#b8a898"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a9e8a"/>
      <stop offset="100%" stop-color="#6b7f6b"/>
    </linearGradient>
  </defs>
  <!-- Book body -->
  <rect width="300" height="400" fill="url(#bg)"/>
  <!-- Book cover -->
  <rect x="30" y="20" width="220" height="300" rx="4" fill="url(#cover)"/>
  <!-- Spine -->
  <rect x="20" y="20" width="18" height="300" rx="2" fill="#5a6e5a"/>
  <!-- Decorative lines on cover -->
  <rect x="50" y="50" width="180" height="3" rx="1.5" fill="white" opacity="0.4"/>
  <rect x="50" y="63" width="120" height="2" rx="1" fill="white" opacity="0.3"/>
  <!-- Illustration area -->
  <ellipse cx="140" cy="160" rx="70" ry="60" fill="white" opacity="0.12"/>
  <!-- House silhouette -->
  <polygon points="140,100 185,140 95,140" fill="white" opacity="0.5"/>
  <rect x="110" y="140" width="60" height="45" fill="white" opacity="0.5"/>
  <rect x="128" y="158" width="24" height="27" fill="#6b7f6b" opacity="0.8"/>
  <!-- Sun -->
  <circle cx="172" cy="118" r="12" fill="#e8c97a" opacity="0.8"/>
  <!-- Title text area -->
  <rect x="50" y="210" width="180" height="4" rx="2" fill="white" opacity="0.6"/>
  <rect x="70" y="222" width="140" height="3" rx="1.5" fill="white" opacity="0.4"/>
  <rect x="90" y="234" width="100" height="3" rx="1.5" fill="white" opacity="0.35"/>
  <!-- Author area -->
  <rect x="80" y="265" width="120" height="2" rx="1" fill="white" opacity="0.25"/>
  <!-- Bottom text -->
  <text x="150" y="370" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#5a4a3a" opacity="0.7">Cleanconscience</text>
</svg>
